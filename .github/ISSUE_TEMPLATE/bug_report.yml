name: Bug report
description: Something in the dashboard or a collector does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not paste API keys, service-role keys, tokens, or the contents of `.env` /
        `projects.config.json` into this issue. Redact anything credential-shaped — the variable
        name alone is enough for us to help.

  - type: dropdown
    id: area
    attributes:
      label: Which part is affected?
      options:
        - Dashboard frontend
        - Collector (npm run collect:status)
        - A specific provider adapter
        - Database / migrations
        - Documentation site
        - Something else
    validations:
      required: true

  - type: input
    id: provider
    attributes:
      label: Provider adapter
      description: If this is adapter-specific, which one? (amplify, aws, cloudflare, github, http, openai, resend, supabase)
      placeholder: cloudflare

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: Include the collector output or browser console error if you have it, with any secrets redacted.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Configure ...
        2. Run `npm run collect:status`
        3. Open the Collectors tab
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag, or the commit SHA if you are running from a branch.
      placeholder: v1.5.0
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Node version, OS, and where the collector runs (GitHub Actions, local, other scheduler).
      placeholder: Node 22, Ubuntu 24.04, GitHub Actions
    validations:
      required: true
